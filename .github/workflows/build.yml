name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # ti permette di avviare manualmente

jobs:
  # ============ WINDOWS MODERNO ============
  build-windows-modern:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m nuitka --standalone --onefile --windows-disable-console --enable-plugin=tk-inter --include-package=customtkinter --include-package=pypdf --include-package=openpyxl --include-package=requests --output-filename=EmailExtractor-Windows10-11.exe main.py
      - uses: actions/upload-artifact@v3
        with:
          name: EmailExtractor-Windows10-11
          path: EmailExtractor-Windows10-11.exe

  # ============ WINDOWS LEGACY (7/8) ============
  build-windows-legacy:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - run: pip install -r requirements.txt
      - run: python -m nuitka --standalone --onefile --windows-disable-console --enable-plugin=tk-inter --include-package=customtkinter --include-package=pypdf --include-package=openpyxl --include-package=requests --output-filename=EmailExtractor-Windows7-8.exe main.py
      - uses: actions/upload-artifact@v3
        with:
          name: EmailExtractor-Windows7-8
          path: EmailExtractor-Windows7-8.exe

  # ============ MAC INTEL ============
  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - run: python -m nuitka --standalone --onefile --macos-create-app-bundle --enable-plugin=tk-inter --include-package=customtkinter --include-package=pypdf --include-package=openpyxl --include-package=requests --output-filename=EmailExtractor-MacIntel main.py
      - uses: actions/upload-artifact@v3
        with:
          name: EmailExtractor-MacIntel
          path: EmailExtractor-MacIntel.app

  # ============ MAC APPLE SILICON ============
  build-mac-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m nuitka --standalone --onefile --macos-create-app-bundle --enable-plugin=tk-inter --include-package=customtkinter --include-package=pypdf --include-package=openpyxl --include-package=requests --output-filename=EmailExtractor-MacSilicon main.py
      - uses: actions/upload-artifact@v3
        with:
          name: EmailExtractor-MacSilicon
          path: EmailExtractor-MacSilicon.app

  # ============ LINUX ============
  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - run: pip install -r requirements.txt
      - run: python -m nuitka --standalone --onefile --enable-plugin=tk-inter --include-package=customtkinter --include-package=pypdf --include-package=openpyxl --include-package=requests --output-filename=EmailExtractor-Linux main.py
      - uses: actions/upload-artifact@v3
        with:
          name: EmailExtractor-Linux
          path: EmailExtractor-Linux
